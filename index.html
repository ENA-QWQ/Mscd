<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSCD</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@callmebill/lxgw-wenkai-web@latest/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
<div class="layout">

    <header class="top-bar">
        <div class="top-bar-left">
            <button class="ena-btn ena-btn--icon hidden" id="back-btn" title="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>
            <span class="top-bar-title" id="top-bar-title">MSCD</span>
        </div>

        <div class="search-wrap">
            <div class="search-mode" id="search-mode"></div>
            <div class="ena-input-wrap search-input-wrap">
                <svg class="ena-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input class="ena-input ena-input--icon" type="text" id="search-input"
                       placeholder="搜索关键词…" />
            </div>
            <button class="ena-btn ena-btn--primary" id="search-btn">搜索</button>
        </div>

        <div class="top-bar-actions" id="top-bar-actions"></div>
    </header>

    <aside class="sidebar">
        <nav class="side-nav" id="side-nav">
            <a href="#" data-view="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <span>浏览</span>
            </a>
            <a href="#" data-view="queue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6" />
                    <line x1="8" y1="12" x2="21" y2="12" />
                    <line x1="8" y1="18" x2="21" y2="18" />
                    <line x1="3" y1="6" x2="3.01" y2="6" />
                    <line x1="3" y1="12" x2="3.01" y2="12" />
                    <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                <span>播放队列</span>
            </a>
            <a href="#" data-view="liked">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                </svg>
                <span>收藏的音乐</span>
            </a>
            <a href="#" data-view="myplaylists">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="14" y2="6" />
                    <line x1="3" y1="12" x2="10" y2="12" />
                    <line x1="3" y1="18" x2="10" y2="18" />
                    <circle cx="17" cy="18" r="3" />
                    <line x1="20" y1="18" x2="20" y2="7" />
                    <path d="M20 7l2-.5" />
                </svg>
                <span>我的歌单</span>
            </a>
            <a href="#" data-view="downloads">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>下载列表</span>
            </a>
            <a href="#" data-view="status">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span>状态中心</span>
            </a>
            <a href="#" data-view="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span>设置</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <section class="content-area" id="content-area"></section>
    </main>

    <footer class="player-bar" id="player-bar">

        <div class="player-info">
            <div class="player-cover" id="player-cover">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="18" cy="16" r="3" />
                </svg>
            </div>
            <div class="player-meta">
                <div class="player-title" id="player-title">未播放</div>
                <div class="player-artist" id="player-artist">从搜索结果中选择歌曲</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="ena-btn ena-btn--icon" id="mode-btn" title="顺序播放">
                    <svg viewBox="0 0 16 16" fill="currentColor" stroke="none"></svg>
                </button>
                <button class="ena-btn ena-btn--icon" id="prev-btn" title="上一首">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="19 20 9 12 19 4" />
                        <rect x="4" y="4" width="2" height="16" />
                    </svg>
                </button>
                <button class="ena-btn ena-btn--primary ena-btn--icon player-play" id="play-btn" title="播放">
                    <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon">
                        <polygon points="6 4 20 12 6 20" />
                    </svg>
                </button>
                <button class="ena-btn ena-btn--icon" id="next-btn" title="下一首">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 4 15 12 5 20" />
                        <rect x="18" y="4" width="2" height="16" />
                    </svg>
                </button>

                <div class="volume-wrap" id="volume-wrap">
                    <button class="ena-btn ena-btn--icon" id="volume-btn" title="音量">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19" />
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
                        </svg>
                    </button>
                    <div class="volume-popup">
                        <input type="range" class="ena-range volume-range" id="volume-slider"
                               min="0" max="100" value="70" />
                    </div>
                </div>
            </div>

            <div class="player-progress-row">
                <span class="player-time" id="player-current">0:00</span>
                <div class="player-progress" id="player-progress">
                    <div class="player-progress-bar" id="player-progress-bar"></div>
                </div>
                <span class="player-time" id="player-duration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <button class="ena-btn ena-btn--icon" id="share-song-btn" title="分享歌曲">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                </svg>
            </button>
            <button class="ena-btn ena-btn--icon" id="download-audio-btn" title="下载音频">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
            </button>
            <button class="ena-btn ena-btn--icon" id="download-lyric-btn" title="下载歌词">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <line x1="4" y1="18" x2="14" y2="18" />
                </svg>
            </button>
            <button class="ena-btn ena-btn--icon" id="queue-btn" title="播放队列">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6" />
                    <line x1="8" y1="12" x2="21" y2="12" />
                    <line x1="8" y1="18" x2="21" y2="18" />
                    <line x1="3" y1="6" x2="3.01" y2="6" />
                    <line x1="3" y1="12" x2="3.01" y2="12" />
                    <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
            </button>
        </div>

    </footer>

    <footer class="multi-select-bar" id="multi-select-bar">
        <div class="multi-select-bar__count">
            已选 <strong id="selection-count">0</strong> 首
        </div>
        <div class="multi-select-bar__actions">
            <button class="multi-select-action" data-action="select-all" title="全选此页">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
                <span>全选此页</span>
            </button>
            <button class="multi-select-action" data-action="select-all-all" title="全选所有">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 4h12v12" />
                    <rect x="4" y="8" width="12" height="12" />
                    <polyline points="7 14 10 17 13 11" />
                </svg>
                <span>全选所有</span>
            </button>
            <button class="multi-select-action" data-action="cancel" title="取消选择">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                <span>取消</span>
            </button>
            <button class="multi-select-action" data-action="add-download" title="添加到下载列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>添加到下载列表</span>
            </button>
            <button class="multi-select-action" data-action="replace-download" title="替换下载列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>替换下载列表</span>
            </button>
            <button class="multi-select-action" data-action="add-playlist" title="添加到播放列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6" />
                    <line x1="8" y1="12" x2="21" y2="12" />
                    <line x1="8" y1="18" x2="21" y2="18" />
                    <line x1="3" y1="6" x2="3.01" y2="6" />
                    <line x1="3" y1="12" x2="3.01" y2="12" />
                    <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
                <span>添加到播放列表</span>
            </button>
            <button class="multi-select-action" data-action="replace-playlist" title="替换播放列表">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="6 4 20 12 6 20" />
                </svg>
                <span>替换播放列表</span>
            </button>
        </div>
    </footer>

</div>

<div class="ena-modal" id="modal-root"></div>
<div class="ena-toast-wrap" id="toast-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.0.0/dist/browser-id3-writer.js"></script>
<script type="module" src="app.js"></script>
</body>

</html>
